# host-gateway resolves to the host IP from inside the container (Linux + Compose 2.4+).
x-app-common: &app-common
  network_mode: host
  extra_hosts:
    - "host.docker.internal:host-gateway"
  restart: unless-stopped
  depends_on:
    migrate:
      condition: service_completed_successfully
  env_file:
    - .env

x-app-healthcheck: &app-healthcheck
  interval: 10s
  timeout: 5s
  retries: 5
  start_period: 20s

services:
  migrate:
    build:
      context: .
      target: migrate
    network_mode: host
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://postgres:postgres@127.0.0.1:5432/elysia_tanstart}
    restart: "no"

  app1:
    <<: *app-common
    image: dukaloco-web-v2:${IMAGE_TAG}
    container_name: dukaloco-web-app1
    healthcheck:
      <<: *app-healthcheck
      test:
        [
          "CMD",
          "wget",
          "-q",
          "--spider",
          "http://127.0.0.1:${APP_PORT:-3000}/api/ready",
        ]
    build:
      context: .
      target: runtime
    network_mode: host
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: ${APP_PORT:-3000}
      DATABASE_URL: ${DATABASE_URL:-postgres://postgres:postgres@127.0.0.1:5432/elysia_tanstart}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      PUSHER_APP_ID: ${PUSHER_APP_ID:-}
      PUSHER_KEY: ${PUSHER_KEY:-}
      PUSHER_SECRET: ${PUSHER_SECRET:-}
      PUSHER_CLUSTER: ${PUSHER_CLUSTER:-mt1}
      PUSHER_HOST: ${PUSHER_HOST:-}
      PUSHER_PORT: ${PUSHER_PORT:-443}
      PUSHER_FORCE_TLS: ${PUSHER_FORCE_TLS:-true}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET: ${R2_BUCKET:-}
      R2_PUBLIC_URL: ${R2_PUBLIC_URL:-}
