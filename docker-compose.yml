# host-gateway resolves to the host IP from inside the container (Linux + Compose 2.4+).
x-app-common: &app-common
  network_mode: host
  extra_hosts:
    - "host.docker.internal:host-gateway"
  restart: unless-stopped
  depends_on:
    migrate:
      condition: service_completed_successfully
  env_file:
    - .env

x-app-healthcheck: &app-healthcheck
  interval: 10s
  timeout: 5s
  retries: 5
  start_period: 20s

services:
  migrate:
    build:
      context: .
      target: migrate
    network_mode: host
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://postgres:postgres@127.0.0.1:5432/elysia_tanstart}
    restart: "no"

  app1:
    <<: *app-common
    image: tanstart-elysia:${IMAGE_TAG:-current}
    container_name: tanstart-elysia-app1
    healthcheck:
      <<: *app-healthcheck
      test:
        [
          "CMD",
          "wget",
          "-q",
          "--spider",
          "http://127.0.0.1:${APP_PORT:-3000}/api/ready",
        ]
    build:
      context: .
      target: runtime
    network_mode: host
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: ${APP_PORT:-3000}

  app2:
    <<: *app-common
    image: tanstart-elysia:${IMAGE_TAG:-current}
    container_name: tanstart-elysia-app2
    profiles:
      - production
    healthcheck:
      <<: *app-healthcheck
      test:
        [
          "CMD",
          "wget",
          "-q",
          "--spider",
          "http://127.0.0.1:${APP_PORT2:-3001}/api/ready",
        ]
    build:
      context: .
      target: runtime
    network_mode: host
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: ${APP_PORT2:-3001}
