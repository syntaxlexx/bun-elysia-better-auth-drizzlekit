services:
  migrate:
    build:
      context: .
      target: migrate
    network_mode: host
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://postgres:postgres@127.0.0.1:5432/elysia_tanstart}
    restart: "no"

  app:
    build:
      context: .
      target: runtime
    network_mode: host
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: ${APP_PORT:-3000}
      DATABASE_URL: ${DATABASE_URL:-postgres://postgres:postgres@127.0.0.1:5432/elysia_tanstart}
      PUSHER_APP_ID: ${PUSHER_APP_ID:-}
      PUSHER_KEY: ${PUSHER_KEY:-}
      PUSHER_SECRET: ${PUSHER_SECRET:-}
      PUSHER_CLUSTER: ${PUSHER_CLUSTER:-mt1}
      PUSHER_HOST: ${PUSHER_HOST:-}
      PUSHER_PORT: ${PUSHER_PORT:-443}
      PUSHER_FORCE_TLS: ${PUSHER_FORCE_TLS:-true}
    volumes:
      - avatars:/app/storage
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:${APP_PORT:-3000}/api/ready').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

volumes:
  avatars:
